esphome:
  name: respeaker-lite
  project:
    name: diycraic.brick_assistant
    version: 2026.04.25
  min_version: 2026.4.2
  friendly_name: ReSpeaker-lite
  platformio_options:
    board_build.flash_mode: dio
  on_shutdown:
    then:
      # Prevent loud noise on software restart
      - lambda: id(respeaker).mute_speaker();

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: octal
  speed: 80MHz

# network:
#   enable_ipv6: true

logger:
  level: DEBUG
  initial_level: WARN
  logs:
    sensor: WARN  # avoids logging debug sensor updates

select:
  - platform: template
    name: "Wake word sensitivity"
    #id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true

api:
  services:
    - service: start_va
      then:
        - voice_assistant.start
    - service: stop_va
      then:
        - voice_assistant.stop

  on_client_connected:
    then:
      - logger.log: "Client connected"
      - light.turn_off: led_internal
      - delay: 50ms
      - micro_wake_word.start:

  on_client_disconnected:
    then:
      - logger.log: "Client disconnected"
      - voice_assistant.stop:

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO43
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: mono # Change to stereo if you are using stereo external speakers
    timeout: never
    buffer_duration: 500ms
    audio_dac: aic3204_dac

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1 # Change to 2 if you are using stereo external speakers
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

http_request:
  # Uncomment this, if you have problems with text-to-speech because of Home Assistant HTTPS internal URL
  # verify_ssl: false
  buffer_size_rx: 2048  # Reduces CPU load when streaming audio

audio_file:
  - id: siren_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/siren.wav
  - id: timer_finished_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/timer_finished.flac
  - id: wake_word_triggered_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/wake_word_triggered.flac
  - id: button_press_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/click.mp3
  - id: notification_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/notification.mp3
  - id: connection_problem_sound
    file: https://github.com/Stepyon/Respeaker-Lite-ESPHome-BrickAssistant/raw/refs/heads/BrickAssistant/sounds/connection_problem.mp3

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  on_connect:
    - logger.log: "wifi connected"
  on_disconnect:
    - logger.log: "wifi disconnected"
  output_power: 12.5 # Decrease TX power to ~12 dBm (helps with wifi stability for some reason)
  ap:
    ssid: "Respeaker-Lite Hotspot"
    password: "diycraic123!"

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components:
      - i2s_audio
    refresh: 0s
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration
      ref: main
    components: 
      - respeaker_lite
    refresh: 0s
  - source:
      # https://github.com/esphome/esphome/pull/14933
      type: git
      url: https://github.com/kahrendt/esphome
      ref: 890e33f99af2c2ea15dc74c3ec4cf32d25203526
    components: [const, media_source, sendspin]
  - source:
      # https://github.com/esphome/esphome/pull/12429
      type: git
      url: https://github.com/esphome/esphome
      ref: ff8ce89556748509d7ee8724e12d9d43d3c8c1e8
    refresh: 0s
    components: [http_request]

audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

globals:
  - id: va_connected
    type: bool
    restore_value: no
    initial_value: "false"
  - id: siren_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_toggle_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: user_button_long_press_timer_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: saved_volume
    type: float
    restore_value: no
    initial_value: '0.5'

############################
# SCRIPTS
############################
script:
  # Script executed when we want to play sounds on the device.
  - id: play_sound
    parameters:
      priority: bool
      # sound_file: "audio::AudioFile*"
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
  - id: short_led_pulse
    mode: restart
    then:
      - light.turn_on:
          id: led_internal
          effect: "Fast Pulse"
          brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
          red: 0%
          green: 0%
          blue: 50%
      - delay: 100ms
      - light.turn_off: led_internal

  - id: timer_led_pulse
    mode: restart
    then:
      - light.turn_on:
          id: led_internal
          effect: "Timer Pulse"
          brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
          red: 100%
          green: 100%
          blue: 0%
      - delay: 30ms
      - light.turn_off: led_internal

  - id: send_wake_word_event
    parameters:
      wake_word: string
    then:
      - homeassistant.event:
          event: esphome.wake_word_detected
          data:
            wake_word: !lambda return wake_word;

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_once
    then:
      - logger.log: "VA: activate_stop_word_once"
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
      - delay: 1s
      # Enable stop wake word
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  - id: long_press_delay
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition:
            binary_sensor.is_on: user_button
          then:
            - logger.log: "Detected a long press => Stopping media"
            - if:
                condition:
                  media_player.is_playing: 
                    id: external_media_player
                then:
                  - media_player.stop:
                      id: external_media_player
                else:
                  - logger.log: "Media not playing, nothing to stop"

  - id: timer_autooff_delay
    mode: restart
    then:
      - delay: 10min
      - if:
          condition:
            - switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing

  - id: siren_autooff_delay
    mode: restart
    then:
      - delay: 20min
      - if:
          condition:
            - switch.is_on: siren_ringing
          then:
            - switch.turn_off: siren_ringing

  - id: save_volume
    then:
      - lambda: |-
          id(saved_volume) = id(external_media_player).volume;

  - id: restore_volume
    then:
      - lambda: |-
          float volume = id(saved_volume);
          auto call = id(external_media_player).make_call();
          call.set_volume(volume);
          call.perform();

############################
# BINARY SENSORS (BUTTONS)
############################
binary_sensor:
  - platform: gpio
    id: user_button
    internal: true
    name: "Volume Down - Stop Button"
    pin:
      number: GPIO4
      mode:
        input: true
      inverted: true
    on_press:
      then:
        - if:
            condition:
              or:
                - switch.is_on: timer_ringing
                - switch.is_on: siren_ringing
            then:
              - logger.log: "Siren/Timer ON => turning OFF"
              - switch.turn_off: timer_ringing
              - switch.turn_off: siren_ringing
            else:
              - media_player.volume_set:
                  id: external_media_player
                  volume: !lambda |-
                    float vol = id(external_media_player).volume - 0.05f;
                    if (vol < 0.1f) {
                      vol = 0.1f;
                      id(short_led_pulse).execute();
                    }
                    return vol;
              - if:
                  condition:
                    media_player.is_playing: 
                      id: external_media_player
                  then:
                    - script.execute: long_press_delay
                  else:
                    - script.execute:
                        id: play_sound
                        priority: false
                        sound_file: "button_press_sound" 

    on_release:
      then:
        - script.stop: long_press_delay

  - platform: template
    id: mic_mute_button
    internal: true
    name: "Volume Up - Mute Button"
    lambda: |-
      // Guard: if (mute_state) isn't ready, default to false
      if (!id(mute_state).has_state()) {
        return false;
      }
      // Return true if the mic is muted, false if not
      return id(mute_state).state;
    on_state:
      then:
        - if:
            condition: # First, guard to ensure mute_state is valid
              lambda: return id(mute_state).has_state();
            then:
              - logger.log: "Mute Button - on_state"
              - if:
                  condition:
                    or:
                      - switch.is_on: timer_ringing
                      - switch.is_on: siren_ringing
                  then:
                    - switch.turn_off: timer_ringing
                    - switch.turn_off: siren_ringing
                    - logger.log: "Siren/Timer is ON => turning Siren/Timer OFF"
                  else:
                    - lambda: |-
                        unsigned long now = millis();
                        // Check if it's a fast toggle (<2s)
                        if ((now - id(last_toggle_time)) < 2000UL) {
                          float current_vol = id(external_media_player).volume;
                          if (current_vol >= 1.0f) {
                            id(short_led_pulse).execute();
                            return;
                          }
                          float vol = current_vol + 0.05f;
                          if (vol > 1.0f) vol = 1.0f;
                          auto call = id(external_media_player).make_call();
                          call.set_volume(vol);
                          call.perform();
                        }
                        id(last_toggle_time) = now;

                    - if:
                        condition:
                          not:
                            media_player.is_playing: 
                              id: external_media_player
                        then:
                          - script.execute:
                              id: play_sound
                              priority: false
                              sound_file: "button_press_sound" 

############################
# SPEAKER & MEDIA PLAYERS
############################
media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: http_request
    id: http_announcement_source
    buffer_size: 250000
  - platform: http_request
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source
    fixed_delay: 480 microseconds  # The AIC3204 DAC used, as configured, on the VPE delays audio by 480 microseconds

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 0.8
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 30
          duration: 200ms
      - wait_until:
          not:
            media_player.is_announcing:
              id: external_media_player
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 500ms

############################
# MICRO WAKE WORD
############################
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
    gain_factor: 4
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      probability_cutoff: 0.6
      id: okay_nabu
    - model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
      id: kenobi
      probability_cutoff: 0.6
    - model: hey_jarvis
      id: hey_jarvis
      probability_cutoff: 0.7
    - model: hey_mycroft
      id: hey_mycroft
      probability_cutoff: 0.8
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      probability_cutoff: 0.2
      id: stop
      internal: true
  vad:
    probability_cutoff: 0.1
  on_wake_word_detected:
    - logger.log:
        format: "Wake word was: %s"
        args: [ 'wake_word' ]
    - script.execute:
        id: send_wake_word_event
        wake_word: !lambda return wake_word;
    - if:
        condition:
          voice_assistant.is_running:
        then:
          voice_assistant.stop:
    - if:
        condition:
          - switch.is_on: timer_ringing
        then:
          - switch.turn_off: timer_ringing
    - if:
        condition:
          media_player.is_announcing:
            id: external_media_player
        then:
          - media_player.stop:
              id: external_media_player
              announcement: true
    - if:
        condition:
          lambda: return wake_word != "Stop";
        then:
          - if:
              condition:
                lambda: |-
                  return id(va_connected);
              then:
                - light.turn_on:
                    id: led_internal
                    brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
                    red: 50%
                    green: 100%
                    blue: 100%
                    effect: "Slow Pulse"
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "wake_word_triggered_sound"
                - delay: 300ms
                - wait_until:
                    not:
                      media_player.is_announcing: 
                        id: external_media_player
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;
                    silence_detection: true
              else:
                - delay: 1s
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "connection_problem_sound"
        else:
          - logger.log: "Stop wake word was used!"
          - light.turn_on:
              id: led_internal
              effect: "Timer Pulse"
              brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
              red: 100%
              green: 0%
              blue: 0%
          - delay: 300ms
          - light.turn_off: led_internal

############################
# VOICE ASSISTANT
############################
voice_assistant:
  id: va
  micro_wake_word: mww
  use_wake_word: false
  microphone:
    microphone: i2s_mics
    channels: 0
  noise_suppression_level: 1
  auto_gain: 0dBFS
  volume_multiplier: 1
  media_player: external_media_player

  on_client_connected:
    then:
      - light.turn_off: led_internal
      - globals.set:
          id: va_connected
          value: "true"

  on_client_disconnected:
    then:
      - globals.set:
          id: va_connected
          value: "false"
      - light.turn_on:
          id: led_internal
          brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
          red: 100%
          green: 50%
          blue: 0%
          effect: "Slow Pulse"
  on_intent_progress:
    - logger.log: "VA: on_intent_progress"
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once

  on_tts_start:
    - if:
        condition:
          - switch.is_off: siren_ringing
        then:
          - logger.log: "VA: on_tts_start"
          - script.execute: activate_stop_word_once

  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'

  on_stt_end:
    - light.turn_off: led_internal
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'

  on_start:
    - if:
        condition:
          - switch.is_off: siren_ringing
        then:
          - logger.log: "VA: on_start"
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 30  # Number of dB quieter; higher implies more quiet, 0 implies full volume
              duration: 0.0s         # The duration of the transition (default is no transition)
          - light.turn_on:
              id: led_internal
              brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
              red: 50%
              green: 100%
              blue: 100%
              effect: "Slow Pulse"

  on_end:
    - if:
        condition:
          - switch.is_off: siren_ringing
        then:    
          - wait_until:
              not:
                voice_assistant.is_running
          - logger.log: "VA: on_end"
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
          # - script.stop: activate_stop_word_once
          - if:
              condition:
                - switch.is_off: timer_ringing
              then:
                - micro_wake_word.disable_model: stop
                - light.turn_off: led_internal

  on_timer_tick:
    - if:
        condition:
          not:
            voice_assistant.is_running
        then:
          - lambda: |-
              id(timer_led_pulse).execute();

  on_timer_finished:
    - switch.turn_on: timer_ringing
    - while:
        condition:
          switch.is_on: timer_ringing
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "timer_finished_sound"              
          - wait_until:
              media_player.is_announcing: 
                id: external_media_player
          - wait_until:
              not:
                media_player.is_announcing: 
                  id: external_media_player
    - light.turn_off: led_internal

  on_timer_cancelled:
    - light.turn_off: led_internal

############################
# SWITCHES (SIREN / TIMER)
############################
switch:
  - platform: template
    id: siren_ringing
    name: "Siren Ring"
    internal: false
    optimistic: false
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(siren_on);
    turn_on_action:
      - globals.set:
          id: siren_on
          value: "true"
      - lambda: id(siren_ringing).publish_state(true);
      - if:
          condition:
            - switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing

      - media_player.stop:
          id: external_media_player
      - delay: 500ms
      - script.execute: save_volume
      - media_player.volume_set:
          id: external_media_player
          volume: 1.0
      - script.execute: siren_autooff_delay
      - while:
          condition:
            switch.is_on: siren_ringing
          then:
            - light.turn_on:
                id: led_internal
                effect: "Siren Pulse"
                brightness: 100%
                red: 100%
                green: 0%
                blue: 0%
            - script.execute:
                id: play_sound
                priority: true
                sound_file: "siren_sound" 
            - delay: 6s
            - wait_until:
                not:
                  media_player.is_playing: 
                    id: external_media_player

    turn_off_action:
      - globals.set:
          id: siren_on
          value: "false"
      - lambda: id(siren_ringing).publish_state(false);
      - light.turn_off: led_internal
      - script.stop: siren_autooff_delay
      - if:
          condition:
            media_player.is_playing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: false
              id: external_media_player
      - script.execute: restore_volume

  - platform: template
    name: "Timer Ring"
    id: timer_ringing
    optimistic: true
    restore_mode: ALWAYS_OFF

    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 15
          duration: 200ms
      - lambda: id(stop).enable();
      - light.turn_on:
          id: led_internal
          effect: "Fast Pulse"
          brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
          red: 0%
          green: 100%
          blue: 100%
      - script.execute: timer_autooff_delay
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            - script.execute:
                id: play_sound
                priority: true
                sound_file: "timer_finished_sound" 
            - wait_until:
                media_player.is_announcing: 
                  id: external_media_player
            - wait_until:
                not:
                  media_player.is_announcing: 
                    id: external_media_player

    on_turn_off:
      - micro_wake_word.disable_model: stop
      - light.turn_off: led_internal
      - script.stop: timer_autooff_delay
      # Stop any current announcement (ie: stop the timer ring mid playback)
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              announcement: true
              id: external_media_player
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s

  - platform: template
    id: notification_ringing
    name: "Notification"
    optimistic: true
    internal: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 15
          duration: 200ms
      - light.turn_on:
          id: led_internal
          brightness: !lambda "return max(id(led).current_values.get_brightness(), 0.2f);"
          red: 70%
          green: 100%
          blue: 100%
          effect: "Timer Pulse"
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "notification_sound" 
      - wait_until:
          media_player.is_announcing: 
            id: external_media_player
      - wait_until:
          not:
            media_player.is_announcing: 
              id: external_media_player
      - switch.turn_off: notification_ringing
    
    on_turn_off:
      - light.turn_off: led_internal
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s

############################
# LED(s)
############################

# Hardware LED (hidden from user)
light:
  - platform: esp32_rmt_led_strip
    id: led_internal
    internal: true
    name: "LED Internal (Hardware)"
    pin: GPIO1
    chipset: ws2812
    num_leds: 1
    rgb_order: grb
    rmt_symbols: 192
    default_transition_length: 0s
    disabled_by_default: true

    effects:
      - addressable_lambda:
          name: "Siren Pulse"
          update_interval: 20ms
          lambda: |-
            static float fraction = 0.0;
            static float step = 0.05;
            static bool increasing = true;

            auto values = id(led_internal)->current_values;
            float user_r = values.get_red()   * 255.0f;
            float user_g = values.get_green() * 255.0f;
            float user_b = values.get_blue()  * 255.0f;
            float user_v = values.get_brightness();

            float scale = fraction * user_v;
            it[0].set_rgb(user_r * scale, user_g * scale, user_b * scale);

            fraction += (increasing ? step : -step);
            if (fraction >= 1.0f) {
              fraction = 1.0f;
              increasing = false;
            } else if (fraction <= 0.0f) {
              fraction = 0.0f;
              increasing = true;
            }

      - addressable_lambda:
          name: "Slow Pulse"
          update_interval: 30ms
          lambda: |-
            static float fraction = 0.0;
            static float step = 0.05;
            static bool increasing = true;

            auto values = id(led_internal)->current_values;
            float user_r = values.get_red()   * 255.0f;
            float user_g = values.get_green() * 255.0f;
            float user_b = values.get_blue()  * 255.0f;
            float user_v = values.get_brightness();

            float scale = fraction * user_v;
            it[0].set_rgb(user_r * scale, user_g * scale, user_b * scale);

            fraction += (increasing ? step : -step);
            if (fraction >= 1.0f) {
              fraction = 1.0f;
              increasing = false;
            } else if (fraction <= 0.0f) {
              fraction = 0.0f;
              increasing = true;
            }

      - addressable_lambda:
          name: "Fast Pulse"
          update_interval: 10ms
          lambda: |-
            static float fraction = 0.0;
            static float step = 0.05;
            static bool increasing = true;

            auto values = id(led_internal)->current_values;
            float user_r = values.get_red()   * 255.0f;
            float user_g = values.get_green() * 255.0f;
            float user_b = values.get_blue()  * 255.0f;
            float user_v = values.get_brightness();

            float scale = fraction * user_v;
            it[0].set_rgb(user_r * scale, user_g * scale, user_b * scale);

            fraction += (increasing ? step : -step);
            if (fraction >= 1.0f) {
              fraction = 1.0f;
              increasing = false;
            } else if (fraction <= 0.0f) {
              fraction = 0.0f;
              increasing = true;
            }

      - addressable_lambda:
          name: "Timer Pulse"
          lambda: |-
            auto values = id(led_internal)->current_values;
            float user_r = values.get_red()   * 255.0f;
            float user_g = values.get_green() * 255.0f;
            float user_b = values.get_blue()  * 255.0f;
            float user_v = values.get_brightness();
            it[0].set_rgb(user_r * user_v, user_g * user_v, user_b * user_v);

# Partition Light => user sees "Led Light" in Home Assistant
# It references the single LED in led_internal, from index 0..0
  - platform: partition
    id: led
    name: "LED Light"
    entity_category: config
    default_transition_length: 0s
    disabled_by_default: false
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:circle-outline"
    initial_state:
      color_mode: rgb
      brightness: 100%
      red: 10%
      green: 73%
      blue: 95%
    segments:
      - id: led_internal
        from: 0
        to: 0

respeaker_lite:
  id: respeaker
  reset_pin: GPIO2
  mute_state:
    internal: true
    id: mute_state
  firmware_version:
    icon: mdi:application-cog
    name: XMOS firmware version
    internal: false
    id: firmware_version
  firmware:
    url: https://github.com/formatBCE/Respeaker-Lite-ESPHome-integration/raw/refs/heads/main/respeaker_lite_i2s_dfu_firmware_48k_v1.1.0.bin
    version: "1.1.0"
    md5: 9297155d1bf3eb21a9d4db52a89ea0c6
    on_begin:
      - light.turn_on:
          brightness: 100%
          red: 0%
          green: 0%
          blue: 100%
          id: led_internal
          effect: "Slow Pulse"
    on_end:
      - light.turn_on:
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          id: led_internal
          effect: "Fast Pulse"
      - delay: 3s
      - light.turn_off:
          id: led_internal
    on_error:
      - light.turn_on:
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          id: led_internal
          effect: "Fast Pulse"
      - delay: 3s
      - light.turn_off:
          id: led_internal

