name: ESPHome validation and build

on:
  push:
    branches: [develop, BrickAssistant]
  pull_request:

permissions:
  contents: read

jobs:
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install ESPHome
        run: python -m pip install -r requirements-ci.txt
      - name: Validate ESPHome YAML
        run: esphome config config/respeaker-lite-brick-assistant.yaml
      - name: Compile ESP32-S3 firmware
        run: esphome compile config/respeaker-lite-brick-assistant.yaml
      - name: Save compiled firmware
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: brickassistant-esphome-firmware
          path: |
            config/.esphome/build/respeaker-lite/.pioenvs/respeaker-lite/firmware.bin
            config/.esphome/build/respeaker-lite/.pioenvs/respeaker-lite/firmware.factory.bin
          if-no-files-found: warn
